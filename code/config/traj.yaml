# 轨迹数据口径（阶段二/三共用，2026-11-02 定为"几百辆"子集方案）
n_taxis: 300        # 子集规模：质量筛选后按 taxi_id 升序取前 N 辆（确定性，可复现）
min_points: 1000    # 质量筛选：有效轨迹点 ≥ N 才入选（全队中位数 ~1570）
stay_dist_m: 200    # 停留圈直径（Zheng 2008 经典口径，GPS 抖动容差）
stay_time_min: 15   # 最小停留时长（分钟），15 分钟不动 = 等客/休息/吃饭
align:
  poi_attach_m: 250     # 停留重心距 POI ≤250m 视为"到达该 POI"（GPS误差+大型POI占地；归因分析后由150放宽）
  road_attach_m: 50     # 距道路段中点 ≤50m 视为停在该路段（与语义图 poi-road 边同口径）
  bbox_v1_only: true    # POI 对齐只在五环内做（POI 覆盖范围）；环外停留仅记区域节点
